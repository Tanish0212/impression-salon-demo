<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Counter poster · Impression Ladies Salon</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap">
  <style>
    /* Printable A5 counter poster. Print with "Margins: none" and "Background graphics" on.
       QR codes are static inline SVG, generated locally with segno (see README). */
    @page { size: A5 portrait; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #E2DACB; font-family: "Mulish", Arial, sans-serif; color: #25302A; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .toolbar { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; padding: 20px 16px 0; }
    .toolbar button { font: 500 15px "Mulish", Arial, sans-serif; padding: 0 24px; min-height: 44px; border: 0; border-radius: 999px; background: #4B6A55; color: #fff; cursor: pointer; }
    .toolbar a { font: 500 15px "Mulish", Arial, sans-serif; color: #4B6A55; align-self: center; min-height: 44px; display: inline-flex; align-items: center; }
    .sheet {
      width: 148mm; height: 210mm; margin: 20px auto 40px; background: #F7F3EC;
      padding: 13mm 13mm 11mm; display: flex; flex-direction: column; align-items: center; text-align: center;
      position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.18); overflow: hidden;
      font-variant-numeric: lining-nums;
    }
    .logo { width: 19mm; height: 19mm; position: relative; }
    .name { margin: 3.5mm 0 0; font: 400 13mm/1 "Marcellus", serif; position: relative; }
    .sub { margin: 2.2mm 0 0; font: 500 2.7mm "Mulish", Arial, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: #4B6A55; position: relative; }
    .ar-name { margin: 1.6mm 0 0; font: 600 4mm/1.4 "Tajawal", sans-serif; color: #4B6A55; position: relative; }
    .rule { width: 18mm; height: 0; border-top: 0.35mm solid #4B6A55; margin: 4.5mm 0 4mm; position: relative; }
    .cta { margin: 0; font: 400 6.6mm/1.15 "Marcellus", serif; color: #4B6A55; position: relative; }
    .cta-ar { margin: 1.6mm 0 0; font: 500 4mm/1.45 "Tajawal", sans-serif; color: #5B645D; position: relative; }
    .qr-box { margin-top: 4.5mm; padding: 2.5mm; background: #fff; border: 0.3mm solid #E2D7C6; border-radius: 1.5mm; position: relative; }
    .qr { display: block; width: 54mm; height: 54mm; }
    .phone { margin: 4.5mm 0 0; font: 500 8.4mm/1 "Mulish", Arial, sans-serif; letter-spacing: .02em; font-variant-numeric: lining-nums tabular-nums; position: relative; }
    .phone-label { margin: 1.6mm 0 0; font: 500 2.6mm "Mulish", Arial, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: #4B6A55; position: relative; }
    .foot {
      margin-top: auto; width: 100%; display: flex; align-items: center; gap: 4mm; text-align: start;
      padding-top: 3.5mm; border-top: 0.25mm solid #E2D7C6; position: relative;
    }
    .qr-small { display: block; width: 19mm; height: 19mm; flex: none; background: #fff; padding: 1.2mm; box-sizing: content-box; border: 0.25mm solid #E2D7C6; }
    .foot p { margin: 0; font: 400 2.85mm/1.45 "Mulish", Arial, sans-serif; color: #5B645D; }
    .foot b { font-weight: 600; color: #25302A; }
    .sheet::before { content: ''; position: absolute; width: 70mm; height: 70mm; right: -24mm; top: -24mm; background: #DCE6D9; border-radius: 0 0 0 100%; opacity: .7; }
    .sheet::after { content: ''; position: absolute; width: 50mm; height: 50mm; left: -20mm; bottom: -20mm; background: #ECE3D5; border-radius: 0 100% 0 0; }
    .rule { border-top: .3mm solid #A9BEA9; }
    .qr-box { border-radius: 2mm 9mm 2mm 9mm; }
    .sheet > * { z-index: 1; }
    @media print {
      body { background: none; }
      .toolbar { display: none; }
      .sheet { margin: 0; box-shadow: none; }
    }
    @media screen and (max-width: 600px) {
      .sheet { zoom: .62; }
    }
  </style>
</head>
